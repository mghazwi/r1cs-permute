[package]
name = "r1cs-permute"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Prepare Circom permuted R1CS and arkzkey resources for dynamic Groth16"

[dependencies]
dynamic-groth16 = { git = "https://github.com/logos-storage/dynamic-groth16", default-features = false }
ark-bn254 = { version = "0.5", default-features = false, features = ["curve"] }
ark-ff = { version = "0.5", default-features = false }
ark-groth16 = { version = "0.5", default-features = false }
ark-relations = { version = "0.5", features = ["std"] }
ark-serialize = { version = "0.5", features = ["derive"] }
ark-circom = { version = "=0.5.0", optional = true }
sha2 = "0.10"
prost = "0.14"
rayon = { version = "1.12", optional = true }

[features]
default = []
parallel = ["dynamic-groth16/parallel", "dep:rayon"]
zkey-reader = ["dep:ark-circom"]

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
serde_json = "1"

[[bench]]
name = "rln"
harness = false
